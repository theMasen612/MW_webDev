<!DOCTYPE html>
<html lang="en">
    <head> 
        <title>Alignment</title>
        <meta charset="UTF-8">
        <style>
            button{ 
                padding: 20px;
                margin: 4px;
                margin-left: 550px;
            }
            #box{ 
                width: 75px; 
                height: 75px;
                background-color:seagreen; 
                color:azure;
                text-align: center;
               
            }
            #box-wraper{
                display: grid;
                grid-template-columns: 1fr 200px 1fr;
                gap: 5px;
            }
            #flex-wrapper{
                display: flex;
                flex-direction: row;
                justify-content-space/between: center;
            }
            
        </style>
    </head>
    <body> 
        <h1> Alingnment notes</h1>
        <div id="box-wraper">
            <div id="box">
                <p> Box 1</p>
            </div>
            <div id="box">
                <P> Box 2</P>
            </div>
            <div id="box">
                <p> Box 3
                </p>
            </div>
            <div id="box"> 
                <p> Box 4</p>
            </div>
        </div>
        <div id="flex-wraper">
            <div id="box">
                <p> Box 1</p>
            </div>
            <div id="box">
                <P> Box 2</P>
            </div>
            <div id="box">
                <p> Box 3
                </p>
            </div>
            <div id="box"> 
                <p> Box 4</p>
            </div>
        </div>
        <button> click me </button>
    </body>
</html>
