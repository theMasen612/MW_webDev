        <h1>Advanced HTML Notes</h1>
        <h3>Lists:</h3>
        <ol type="I"> <!--Creates a numbered list-->
            <li> id ="even" This is the first thing</li>
            <li>This is the second thing</li>
            <li>This is the third thing</li>
        </ol>
        <ul> <!--Creates a bulleted list-->
            <li>Apple</li>
            <li>Banana</li>
            <li>Orange</li>
            <li>Kiwi</li>
        </ul>
        <dl> <!--Detailed list-->
            <dt>Fall</dt>
            <dd>Halloween</dd>
            <dd>Thanksgiving</dd>
            <dt>Winter</dt>
            <dd>Christmas</dd>
            <dd>Hanukkah</dd>
            <dd>New Years</dd>
        </dl>
