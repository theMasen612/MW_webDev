<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>CSS Styling with color</title>
        <meta charset="UTF-8">  
        <style>
        #complementary{
            background-color:rgba(27, 85, 133, 0.664);
            border-radius: 10px;
            width:25%; /*% does the percentage of the screen*/
            height:75px;
            font-size: 1em; /*em adjusts the size based on the other font sizes. vw and vh adjust size based on the size of the screen.*/
            border: dashed 5px rgba(218, 126, 41, 0.767);
                }
            #Analogous{
            background-color:rgba(127, 21, 197, 0.664);
            border-radius: 10px;
            width:25%; /*% does the percentage of the screen*/
            height:75px;
            font-size: 1em; /*em adjusts the size based on the other font sizes. vw and vh adjust size based on the size of the screen.*/
            border: dashed 5px rgba(41, 44, 218, 0.767);
                }
            #Triadic{
            background-color:rgba(197, 21, 21, 0.664);
            border-radius: 10px;
            width:25%; /*% does the percentage of the screen*/
            height:75px;
            font-size: 1em; /*em adjusts the size based on the other font sizes. vw and vh adjust size based on the size of the screen.*/
            border: dashed 5px rgba(41, 44, 218, 0.767);
            }
            #word{ color:rgb(216, 196, 80)}
        </style>
          </head>      
    <body>
       <div Id="complementary"> 
        <p> complementary</p>

       </div>
       <div Id="Analogous"> 
        <p>Analogous</p>

       </div>
    </div>
    <div Id="Triadic"> 
     <p Id="word">Triadic</p>

    </div>
    </body>
